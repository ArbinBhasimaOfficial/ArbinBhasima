<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--Space Gortesk-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
            rel="stylesheet"
        />
        <!--link to favicon-->
        <link rel="icon" href="../../Assets/logos/Day2-Positivus/favicon.ico" />
        <!--link to css-->
        <link rel="stylesheet" href="../../CSS/Day2Positivus.css" />
        <title>Positivus</title>
    </head>
    <body>
        <div class="wrapper background">
            <header>
                <!--logo-->
                <img
                    class="PositivusLogo"
                    src="../../Assets/logos/Day2-Positivus/PositivusLogo.png"
                    alt="company logo"
                />
                <!--NavBar-->
                <nav class="Header-NavBar">
                    <!--Navigations-->
                    <ul class="Header-NavBar-List">
                        <li class="Header-NavBar-List-Item">
                            <a href="#" class="Header-NavBar-List-Item-link"
                                >About Us</a
                            >
                        </li>
                        <li class="Header-NavBar-List-Item">
                            <a href="#" class="Header-NavBar-List-Item-link"
                                >Services</a
                            >
                        </li>
                        <li class="Header-NavBar-List-Item">
                            <a href="#" class="Header-NavBar-List-Item-link"
                                >Use Cases</a
                            >
                        </li>
                        <li class="Header-NavBar-List-Item">
                            <a href="#" class="Header-NavBar-List-Item-link"
                                >Pricing</a
                            >
                        </li>
                        <li class="Header-NavBar-List-Item">
                            <a href="#" class="Header-NavBar-List-Item-link"
                                >Blog</a
                            >
                        </li>
                    </ul>
                    <!--DarkLightToggle-->
                    <div class="dark-toggle">
                        <input
                            type="checkbox"
                            id="darkMode"
                            class="toggle-checkbox"
                        />
                        <label for="darkMode" class="darkToggleLabel"></label>
                    </div>
                    <!--Button Secondary-->
                    <button type="button" class="btn">Request a quote</button>
                </nav>
            </header>
            <main>
                <section class="HeroSections">
                    <div class="HeroSectionsLHS">
                        <h1>Navigating the digital landscape for success</h1>
                        <p>
                            Our digital marketing agency helps businesses grow
                            and succeed online through a range of services
                            including SEO, PPC, social media marketing, and
                            content creation.
                        </p>
                        <button type="button" class="btn btn-primary">
                            Book a Consultation
                        </button>
                    </div>
                    <div class="HeroSectionsRHS">
                        <img
                            class="HeroIllustrationImage"
                            src="../../Assets/images/Day2-Positivus/HeroIllustration.png"
                            alt="Hero illustration with a annoying mic."
                        />
                    </div>
                </section>
                <section class="LogoMarquee">
                    <div class="LogoMarqueeContainer">
                        <!--list of logos -->
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Amazon.png"
                            alt="Amazon Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Dribble.png"
                            alt="Dribble Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/HubSpot.png"
                            alt="HubSpot Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Notion.png"
                            alt="Notion Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Netflix.png"
                            alt="Netflix Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Zoom.png"
                            alt="Zoom Logo And Nothing Else"
                        />
                        <!--duplicated list for seamless loop-->
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Amazon.png"
                            alt="Amazon Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Dribble.png"
                            alt="Dribble Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/HubSpot.png"
                            alt="HubSpot Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Notion.png"
                            alt="Notion Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Netflix.png"
                            alt="Netflix Logo And Nothing Else"
                        />
                        <img
                            class="MarqueeLogo"
                            src="../../Assets/images/Day2-Positivus/Zoom.png"
                            alt="Zoom Logo And Nothing Else"
                        />
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
