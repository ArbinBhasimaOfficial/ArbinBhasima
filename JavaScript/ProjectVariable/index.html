<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="./script.js" defer></script>
        <title>Cart Counter</title>
    </head>
    <body>
        <p>Cart Quantity</p>
        <button
            type="button"
            onclick="console.log(`Cart Quantity: ${cartQuantity}`)"
        >
            Show Quantity
        </button>
        <button
            type="button"
            onclick="
                cartQuantity = cartQuantity + 1;
                console.log(`Cart Quantity: ${cartQuantity}`);
            "
        >
            Add to Cart
        </button>
        <button
            type="button"
            onclick="
                cartQuantity = cartQuantity + 2;
                console.log(`Cart Quantity: ${cartQuantity}`);
            "
        >
            +2
        </button>
        <button
            type="button"
            onclick="
                cartQuantity = cartQuantity + 3;
                console.log(`Cart Quantity: ${cartQuantity}`);
            "
        >
            +3
        </button>
        <button
            type="button"
            onclick="
                cartQuantity = 0;
                console.log('Cart is reset.');
                console.log(`Cart Quantity: ${cartQuantity}`);
            "
        >
            Reset Cart
        </button>
    </body>
</html>
